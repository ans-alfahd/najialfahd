<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="/">نظام الكتب والوثائق</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link" href="{{ url_for('incoming_books') }}">الكتب الواردة</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('outgoing_books') }}">الكتب الصادرة</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('outgoing_documents') }}">الوثائق الصادرة</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('incoming_documents') }}">الوثائق الواردة</a></li>
      </ul>
      <form class="d-flex" method="get" action="{{ url_for('search') }}">
        <input class="form-control me-2" type="search" placeholder="بحث" aria-label="Search" name="q">
        <button class="btn btn-outline-success" type="submit">بحث</button>
      </form>
    </div>
  </div>
</nav>
<div class="container">
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="alert alert-info">
          {% for message in messages %}
            <div>{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
